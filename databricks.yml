bundle:
  name: drugsafety360_jsl

include:
  - resources/*.yml

variables:
  target_catalog:
    description: Writable catalog for isolated project data; never point at the Marketplace catalog
    default: workspace

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/DrugSafety360/.bundle/${bundle.name}/${bundle.target}
