name: DrugSafety360 validation
on:
  push:
    branches:
      - main
      - fix/audited-databricks-deployment
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test-only dependencies
        run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7" "pyspark==3.5.3"
      - name: Validate source-format notebooks and bundle contracts
        run: python -m pytest tests/test_contract.py -q
      - name: Execute REAL notebook code with synthetic local Spark frames
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest tests/test_spark_pipeline.py -q -s
